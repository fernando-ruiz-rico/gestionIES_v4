<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GestionIES v4</title>
    
    <!-- Bootstrap 5.3.8 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    
    <!-- Bootstrap Icons 1.13.1 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    
    <!-- Estilos personalizados mínimos -->
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <div id="app">
        <!-- Pantalla de Login -->
        <login-view v-if="!isLoggedIn" @login-success="handleLoginSuccess"></login-view>
        
        <!-- Aplicación principal -->
        <app-layout v-else 
            :usuario="usuario" 
            :menus="menus"
            @logout="handleLogout">
        </app-layout>
    </div>
    
    <!-- Vue 3 (desde CDN, sin compilación) -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    
    <!-- Bootstrap 5.3.8 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    
    <!-- SweetAlert2 para mensajes -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Componentes y lógica de la aplicación -->
    <script src="js/components/login-view.js"></script>
    <script src="js/components/app-layout.js"></script>
    <script src="js/components/sidebar.js"></script>
    <script src="js/components/header-bar.js"></script>
    <script src="js/views/home-view.js"></script>
    <script src="js/api/auth.js"></script>
    <script src="js/api/app.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
