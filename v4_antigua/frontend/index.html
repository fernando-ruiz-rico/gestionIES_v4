<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Gestión interna del IES San Vicente">
  <title>Gestión IES</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css?v=4">
  <link rel="stylesheet" href="css/estilos_programaciones.css?v=4">
  <link rel="stylesheet" href="css/app.css?v=4">
</head>
<body class="bg-body-tertiary">
  <div id="app" v-cloak>
    <div v-if="checkingSession" class="min-vh-100 d-flex align-items-center justify-content-center">
      <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Cargando…</span></div>
    </div>

    <main v-else-if="!session.authenticated" class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
      <div class="card border-0 shadow-sm login-card">
        <div class="card-body p-4 p-md-5">
          <div class="text-center mb-4">
            <i class="bi bi-mortarboard-fill display-4 text-primary" aria-hidden="true"></i>
            <h1 class="h3 mt-2 mb-1">Gestión IES</h1>
            <p class="text-body-secondary mb-0">Acceso a la gestión interna</p>
          </div>
          <div v-if="loginError" class="alert alert-danger" role="alert">{{ loginError }}</div>
          <form @submit.prevent="login">
            <div class="mb-3">
              <label for="login" class="form-label">Usuario</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person" aria-hidden="true"></i></span>
                <input v-model.trim="credentials.login" id="login" name="login" class="form-control" autocomplete="username" required autofocus>
              </div>
            </div>
            <div class="mb-4">
              <label for="password" class="form-label">Contraseña</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-key" aria-hidden="true"></i></span>
                <input v-model="credentials.password" id="password" name="password" type="password" class="form-control" autocomplete="current-password" required>
              </div>
            </div>
            <button class="btn btn-primary w-100" :disabled="loggingIn">
              <span v-if="loggingIn" class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
              Entrar
            </button>
          </form>
        </div>
      </div>
    </main>

    <div v-else class="d-flex min-vh-100">
      <aside class="offcanvas-lg offcanvas-start border-end bg-white app-sidebar" tabindex="-1" id="appMenu" aria-labelledby="appMenuLabel">
        <div class="offcanvas-header border-bottom">
          <h2 class="offcanvas-title h5 mb-0" id="appMenuLabel"><i class="bi bi-mortarboard-fill me-2 text-primary"></i>Gestión IES</h2>
          <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#appMenu" aria-label="Cerrar"></button>
        </div>
        <div class="p-3 border-bottom">
          <div class="fw-semibold text-truncate">{{ session.name || session.login }}</div>
          <small class="text-body-secondary">{{ roleLabel }}</small>
        </div>
        <nav class="list-group list-group-flush overflow-y-auto" aria-label="Menú principal">
          <template v-for="(item, index) in session.menus" :key="index">
            <button v-if="!item.link" type="button" class="list-group-item list-group-item-action d-flex align-items-center gap-2 fw-semibold"
                    @click="toggleGroup(item.id)" :aria-expanded="openGroups[item.id] ? 'true' : 'false'">
              <i :class="['bi', iconFor(item.icono)]" aria-hidden="true"></i>
              <span class="flex-grow-1 text-start">{{ item.texto }}</span>
              <i :class="['bi', openGroups[item.id] ? 'bi-chevron-up' : 'bi-chevron-down']" aria-hidden="true"></i>
            </button>
            <button v-else-if="!item.submenu || openGroups[item.id]" type="button"
                    :class="['list-group-item', 'list-group-item-action', 'd-flex', 'align-items-center', 'gap-2', {'ps-5': item.submenu, active: isActive(item.link)}]"
                    @click="activateMenu(item)">
              <i :class="['bi', iconFor(item.icono)]" aria-hidden="true"></i>
              <span>{{ item.texto }}</span>
            </button>
          </template>
        </nav>
      </aside>

      <div class="flex-grow-1 min-w-0">
        <header class="navbar bg-white border-bottom sticky-top px-3">
          <button class="btn btn-outline-secondary d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#appMenu" aria-controls="appMenu">
            <i class="bi bi-list" aria-hidden="true"></i><span class="visually-hidden">Abrir menú</span>
          </button>
          <span class="navbar-brand h1 fs-5 mb-0 ms-2">{{ pageTitle }}</span>
          <button class="btn btn-outline-secondary ms-auto" type="button" @click="reloadPage" title="Actualizar">
            <i class="bi bi-arrow-clockwise" aria-hidden="true"></i><span class="visually-hidden">Actualizar</span>
          </button>
        </header>

        <main class="container-fluid p-3 p-lg-4">
          <div v-if="pageLoading" class="py-5 text-center">
            <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Cargando…</span></div>
          </div>
          <div v-else-if="pageError" class="alert alert-danger" role="alert">
            <h2 class="h5"><i class="bi bi-exclamation-triangle me-2"></i>No se pudo cargar la sección</h2>
            <p class="mb-0">{{ pageError }}</p>
          </div>
          <section v-else id="legacy-page" @click.capture="handleContentClick" v-html="pageHtml"></section>
        </main>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/vue@3.5.41/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="lib/js/tinymce/tinymce.min.js?v=7.9.1"></script>
  <script src="js/dom.js?v=4"></script>
  <script src="js/main.js?v=9"></script>
  <script src="js/app.js?v=4"></script>
</body>
</html>
